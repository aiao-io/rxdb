packages:
  - 'packages/*'
  - 'apps/*'
  # modules/ 其余成员只靠 tsconfig paths 被消费，不必进 workspace；wujie 与 recipes-domain 是例外：
  # wujie 给 Docusaurus 的 webpack 走 node_modules 软链；recipes-domain 给 dev-rxdb-http-server
  # 的 Node 类型剥离直跑（`node src/main.ts` 不认 tsconfig paths，只能顺着 node_modules 找 dist）。
  - 'modules/wujie'
  - 'modules/recipes-domain'
  - 'website'
  - 'benchmarks'
allowBuilds:
  # trigger.dev CLI 的 depot：安装脚本下载云端远程构建器，自建实例在本机 Docker 构建，用不到
  '@depot/cli': false
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': false
  '@tarojs/cli': false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  pnpm: true
  postman-code-generators: false
  sharp: true
  unrs-resolver: true
  # wrangler 的 workerd：安装脚本只是校验 / 回退下载平台二进制，二进制由可选依赖 @cloudflare/workerd-<平台> 提供
  workerd: false

autoInstallPeers: true
enablePrePostScripts: true
# pnpm 11+ 默认给安装加 24 小时「发布年龄」门槛：锁文件里出现发布不满 24h 的版本
# 就拒绝安装（含 --frozen-lockfile 的 CI）。本仓库按固定节奏做安全升级，刚刷新的
# 锁文件必然含新发布版本（caniuse-lite 这类每日发布的传递依赖更无法避免），
# 门槛只会让升级 PR 的 CI 恒红。供应链完整性由 scripts/audit/ 的 wa-sqlite 钉死、
# 工作区补丁审计与 action pin 审计兜底，这里显式关掉年龄门槛（0 = 不设门槛）。
minimumReleaseAge: 0
gitShallowHosts:
  - github.com
  - gitlab.com
  - bitbucket.org
overrides:
  '@babel/core@7': ^7.29.7
  # 0.5.15 把 Emscripten FS 移出 JS 产物（懒加载 artifact），rxdb-adapter-pglite 的
  # 恢复/清理链路依赖 `Module.FS.filesystems.IDBFS` 直接失效（40+ 用例崩溃）。钉在 0.5.12，
  # 升 0.5.16+ 前先让适配器适配新的 FS 生命周期。
  '@electric-sql/pglite': 0.5.12
  '@angular/cdk': 22.2.6
  '@angular/common': 22.2.4
  '@angular/core': 22.2.4
  '@angular/forms': 22.2.4
  '@angular/platform-browser': 22.2.4
  '@codemirror/language': ^6.13.1
  '@codemirror/state': ^6.7.6
  '@codemirror/view': ^6.43.14
  '@jimp/core>mkdirp': ^0.5.6
  '@jimp/core>phin': ^3.7.1
  '@jimp/jpeg>jpeg-js': ^0.4.4
  miniprogram-automator>debug: ^4.4.3
  '@lucide/angular': 1.70.0
  '@tarojs/helper>esbuild': ^0.25.12
  '@tarojs/plugin-doctor>glob': ^10.5.0
  '@tarojs/plugin-framework-react>vite': 6.4.4
  '@tarojs/vite-runner>vite': 6.4.4
  '@tarojs/vite-runner>vite-plugin-static-copy': ^2.3.2
  '@visactor/vtable>lodash': ^4.18.1
  '@vitejs/plugin-legacy>vite': 6.4.4
  adm-zip: ^0.6.1
  axios@1: ^1.20.0
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  cacheable-request@2>http-cache-semantics: ^4.2.0
  compression@1: ^1.8.2
  dev-rxdb-miniprogram>react: ^18.3.1
  dev-rxdb-miniprogram>react-dom: ^18.3.1
  dompurify@3: ^3.4.16
  fast-uri@3: ^3.1.8
  geojson-flatten>minimist: ^1.2.8
  handlebars@4: ^4.7.10
  image-size@2: ^2.0.3
  joi@17: ^17.13.8
  js-yaml@4: ^4.3.2
  katex@0.16: 0.18.11
  lodash-es: ^4.18.1
  postcss-selector-parser@6: ^7.1.6
  postman-collection>uuid: ^11.1.1
  proxy-addr@2: ^2.0.8
  qs: ^6.16.0
  react: ^19.3.0
  react-dom: ^19.3.0
  sass-embedded: 1.104.1
  serialize-javascript: ^7.1.2
  sharp: ^0.35.5
  shell-quote@1: ^1.11.0
  smol-toml: ^1.9.0
  sockjs>uuid: ^11.1.1
  source-map-js@1: ^1.2.2
  swiper: ^12.2.0
  tinypool@1: 2.2.0
  typescript: 6.0.3
  undici@7: ^7.29.1
  vitest: 4.1.11
  vue: ^3.5.43
  yaml@1: ^1.10.3
patchedDependencies:
  '@easyops-cn/docusaurus-search-local@0.55.3': patches/@easyops-cn__docusaurus-search-local@0.55.3.patch
  '@tarojs/vite-runner@4.3.2': patches/@tarojs__vite-runner@4.3.2.patch
  typescript@6.0.3: patches/typescript@6.0.3.patch
peerDependencyRules:
  allowedVersions:
    '@tarojs/components-react>react': '18'
    '@tarojs/plugin-framework-react>react': '18'
    '@tarojs/react>react': '18'
    react-dom>react: '18'
    react-reconciler>react: '18'
strictPeerDependencies: false

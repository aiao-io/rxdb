_format_version: '3.0'
_transform: true
consumers:
  - username: anon
    keyauth_credentials:
      - key: '${ANON_KEY}'
    acls:
      - group: anon
  - username: service_role
    keyauth_credentials:
      - key: '${SERVICE_ROLE_KEY}'
    acls:
      - group: admin

plugins:
  - name: cors
    config:
      origins: ['http://localhost:4300', 'http://127.0.0.1:4300', 'http://127.0.0.1:4399']
      methods: [GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS]
      headers: [Accept, Authorization, Content-Type, apikey, Prefer, Range, X-Client-Info, X-Supabase-Api-Version]
      exposed_headers: [Content-Range, X-Supabase-Api-Version]
      credentials: false
      max_age: 3600

services:
  - name: auth-verify
    url: http://auth:9999/verify
    routes:
      - name: auth-verify
        paths: ['/auth/v1/verify']
        strip_path: true
  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth
        paths: ['/auth/v1/']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
  - name: rest
    url: http://rest:3000/
    routes:
      - name: rest
        paths: ['/rest/v1/']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
  - name: realtime-ws
    url: http://realtime-dev.supabase-realtime:4000/socket
    routes:
      - name: realtime-ws
        paths: ['/realtime/v1/']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers: ['x-tenant-id:realtime-dev']
  - name: realtime-rest
    url: http://realtime-dev.supabase-realtime:4000/api
    routes:
      - name: realtime-rest
        paths: ['/realtime/v1/api']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers: ['x-tenant-id:realtime-dev']

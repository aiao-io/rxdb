_format_version: '3.0'
_transform: true
consumers:
  - username: anon
    keyauth_credentials:
      - key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6ImFpYW8tbG9jYWwiLCJpYXQiOjE3OTMwMjQ5NTgsImV4cCI6MjEwODM4NDk1OH0.Ar6LeIHVpWQmg4s0k6vG3OEaSvPPX8kR3kAhvw8p4rI'
    acls:
      - group: anon
  - username: service_role
    keyauth_credentials:
      - key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoiYWlhby1sb2NhbCIsImlhdCI6MTc5MzAyNDk1OCwiZXhwIjoyMTA4Mzg0OTU4fQ.x_d9cPEfrafmI-2BzBGOmV7TTDTkYBSVTmlUPrV8mFw'
    acls:
      - group: admin

plugins:
  - name: cors
    config:
      origins: ['http://localhost:4300', 'http://127.0.0.1:4300', 'http://127.0.0.1:4399']
      methods: [GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS]
      headers:
        [
          Accept,
          Authorization,
          Content-Type,
          apikey,
          Prefer,
          Range,
          X-Client-Info,
          X-Supabase-Api-Version,
          Accept-Profile,
          Content-Profile,
          X-Retry-Count
        ]
      exposed_headers: [Content-Range, X-Supabase-Api-Version, Accept-Profile, Content-Profile, X-Retry-Count]
      credentials: false
      max_age: 3600

services:
  - name: auth-verify
    url: http://auth:9999/verify
    routes:
      - name: auth-verify
        paths: ['/auth/v1/verify']
        strip_path: true
  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth
        paths: ['/auth/v1/']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
  - name: rest
    url: http://rest:3000/
    routes:
      - name: rest
        paths: ['/rest/v1/']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
  - name: realtime-ws
    url: http://realtime-dev.supabase-realtime:4000/socket
    routes:
      - name: realtime-ws
        paths: ['/realtime/v1/']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers: ['x-tenant-id:realtime-dev']
  - name: realtime-rest
    url: http://realtime-dev.supabase-realtime:4000/api
    routes:
      - name: realtime-rest
        paths: ['/realtime/v1/api']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers: ['x-tenant-id:realtime-dev']

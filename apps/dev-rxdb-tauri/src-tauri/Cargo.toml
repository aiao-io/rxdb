[package]
name = "dev-rxdb-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# 曾经有第二个二进制（一致性测试的 stdio 宿主），它已随宿主一起迁进
# `packages/rxdb-adapter-tauri/rust`。`default-run` 保留：`tauri dev` 的 DevCommand 走
# `cargo run`，将来再多一个 example/bin 时不指定它就会因无法选择而失败。
default-run = "dev-rxdb-tauri"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dev_rxdb_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
# 自检报告是 JSON（`selfcheck.rs`），前端契约测试断言的就是它的形状。
serde_json = "1"
# 桌面宿主本体（US-210 T2）。**path 依赖**：这个 crate 没有发到 crates.io，
# 外部用户今天只能 path / git 依赖，理由与后果见 `../../../packages/rxdb-adapter-tauri/rust/README.md`。
# demo 反过来依赖包，是包化的验收方式本身——它证明「用户照着 demo 抄」这条路是通的。
# `rusqlite` / `uuid` 不再直接出现在这里：它们是宿主的实现细节，随宿主一起搬走了。
aiao-rxdb-tauri = { path = "../../../packages/rxdb-adapter-tauri/rust" }

[dev-dependencies]
# 只有 `selfcheck.rs` 的测试用来给临时目录起唯一名字。
uuid = { version = "1", features = ["v4"] }


[package]
name = "dev-rxdb-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# 本 crate 有两个二进制（见下方 `[build-dependencies]` 后的说明），
# 不指定 `default-run` 时 `cargo run`（`tauri dev` 的 DevCommand）会因无法选择而失败。
default-run = "dev-rxdb-tauri"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dev_rxdb_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

# `src/bin/rxdb_host_stdio.rs` 由 cargo 自动发现为第二个二进制：一致性测试专用，
# 在 stdin/stdout 上跑同一套 `rxdb` 宿主而不启动 `tauri::App`，见 `conformance/`。

[dependencies]
tauri = { version = "=2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
# 线协议是 JSON：`rxdb` 模块要自己解析 renderer 请求、构造应答，不能只靠 tauri 的 IPC 层。
serde_json = "1"
# 一个 session 一条物理连接（US-210 AC#2 由构造保证）。
# `bundled` 固定 SQLite 版本，不受各平台系统库版本影响；`functions` 用于触发器回调的
# 标量函数 `rxdb_desktop_notify`；`blob` 用于 BLOB 绑定与读取。
# hooks：SQLite authorizer，用来把 ATTACH/DETACH 挡在应用作用域之外（见 Engine::initialize）
rusqlite = { version = "0.32", features = ["bundled", "functions", "blob", "hooks"] }
# sessionId 由 host 生成，形状必须匹配协议里的 UUID 正则。
uuid = { version = "1", features = ["v4"] }


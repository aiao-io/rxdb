<div class="tb plain" data-drag>
  <div class="title">{{ name }}</div>
  <div class="tbz"><app-traffic-lights /></div>
  <div class="grow"></div>
  <div class="tbz">
    <button class="tbtn" #share (click)="openShare(share)" data-nodrag data-pvshare title="Share">
      <svg appIcon="g-share"></svg>
    </button>
    <button class="tbtn" (click)="toggleFind()" data-nodrag data-pvfind title="Search">
      <svg appIcon="g-search"></svg>
    </button>
    <div
      class="sfield"
      [style.opacity]="finding() ? '1' : '0'"
      [style.padding]="finding() ? null : '0'"
      [style.width]="finding() ? '150px' : '0px'"
      data-nodrag
      data-pvfield
      style="
        overflow: hidden;
        transition:
          width 0.22s var(--e-out),
          opacity 0.16s,
          padding 0.22s;
      "
    >
      <span><svg appIcon="g-search"></svg></span>
      <input #field (input)="find(field.value)" placeholder="Search" spellcheck="false" />
    </div>
  </div>
</div>
<div class="pv" #body style="flex-direction: column">
  @switch (kind) {
    @case ('sheet') {
      <div class="sheet">
        <h1>Interface Guidelines</h1>
        <p style="margin: 0 0 2px; font-size: 12.5px">Revision 4 · July 2026</p>
        @for (section of sheet; track section.title) {
          <h3>{{ section.title }}</h3>
          <p>{{ section.text }}</p>
        }
      </div>
    }
    @case ('video') {
      <div
        style="
          width: min(520px, 100%);
          aspect-ratio: 16/9;
          border-radius: 8px;
          background: #0c0c0e;
          display: grid;
          place-items: center;
          box-shadow: 0 20px 60px -18px rgba(0, 0, 0, 0.6);
        "
      >
        <button class="btn pri" style="height: 44px; width: 44px; padding: 0; border-radius: 50%">
          <svg appIcon="g-play"></svg>
        </button>
      </div>
      <div style="margin-top: 14px; font-size: 12px; color: var(--txt-2)">{{ name }} — 1920×1080 · H.264</div>
    }
    @default {
      <img [alt]="name" [src]="image" style="max-height: 78%" />
      <div style="margin-top: 14px; font-size: 12px; color: var(--txt-2)">{{ name }}</div>
    }
  }
</div>

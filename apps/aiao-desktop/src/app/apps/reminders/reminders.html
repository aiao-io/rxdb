<div class="wb">
  <div class="sbar" data-drag style="width: 206px">
    <div class="sb-top"><app-traffic-lights /></div>
    <div class="grp">
      <div class="gh">My Lists</div>
      @for (list of lists; track list[0]) {
        <div class="si">
          <span
            class="ico"
            [style.background]="list[1]"
            style="
              width: 16px;
              height: 16px;
              border-radius: 50%;
              color: #fff;
              display: grid;
              place-items: center;
              font-size: 8px;
            "
          >
            ●
          </span>
          <span class="nm">{{ list[0] }}</span>
          <span class="tail">{{ list[2] }}</span>
        </div>
      }
    </div>
  </div>
  <div class="wmain">
    <div class="tbar" data-drag style="height: 52px">
      <div class="fx-title" style="color: var(--blue); font-size: 22px; font-weight: 700">Today</div>
      <div class="grow" style="flex: 1"></div>
      <button class="tbtn" (click)="add()" data-nodrag data-radd title="New Reminder">
        <svg appIcon="g-plus"></svg>
      </button>
    </div>
    <div class="scroll" data-rlist style="flex: 1; padding: 6px 18px 20px">
      @for (item of items(); track item.id) {
        <div
          class="rem"
          [attr.data-ri]="item.fresh ? null : item.id"
          (click)="toggle(item)"
          (keydown.enter)="toggle(item)"
          style="
            display: flex;
            gap: 11px;
            align-items: flex-start;
            padding: 9px 2px;
            border-bottom: 0.5px solid var(--line);
          "
          tabindex="-1"
        >
          <span
            class="rc"
            [style.background]="item.done ? item.tint : 'transparent'"
            [style.border]="'1.6px solid ' + (item.done ? item.tint : 'var(--txt-3)')"
            style="
              width: 17px;
              height: 17px;
              border-radius: 50%;
              flex: none;
              margin-top: 1px;
              display: grid;
              place-items: center;
              color: #fff;
            "
          >
            @if (item.done) {
              <svg appIcon="g-check" style="width: 10px; height: 10px"></svg>
            }
          </span>
          @if (item.fresh) {
            <span style="min-width: 0; flex: 1">
              <span
                #draft
                [attr.contenteditable]="item.editing ? 'true' : null"
                [style.color]="item.done ? 'var(--txt-3)' : null"
                [style.text-decoration]="item.done ? 'line-through' : null"
                (blur)="commit(item, draft.textContent)"
                (keydown.enter)="finish($event, draft)"
                data-rnew
                style="display: block; font-size: 13px; outline: none; min-height: 17px"
                tabindex="-1"
              ></span>
              <span style="font-size: 11.5px; color: var(--txt-2)">{{ item.when }}</span>
            </span>
          } @else {
            <span style="min-width: 0">
              <span
                [style.color]="item.done ? 'var(--txt-3)' : null"
                [style.text-decoration]="item.done ? 'line-through' : null"
                style="display: block; font-size: 13px"
              >
                {{ item.title }}
              </span>
              <span style="font-size: 11.5px; color: var(--txt-2)">{{ item.when }}</span>
            </span>
          }
        </div>
      }
    </div>
  </div>
</div>

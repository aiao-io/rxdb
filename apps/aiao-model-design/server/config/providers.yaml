# 网关 provider 注册清单
# 引用：specs/006-model-gateway/spec.md FR-002 / FR-003 / FR-004 / FR-056
#
# 字段说明：
#   id            provider 唯一标识，作为 registry 主键
#   modality      'chat' | 'asr' | 'tts'
#   modelIds      该 provider 注册的 model id 列表（model registry 唯一权威）
#   baseUrl       上游 HTTP base URL（${env:VAR:-default} 占位语法）
#   apiKey        上游 API key / 密钥
#   capabilities  能力声明，仅允许白名单 ['stream', 'reference_voice', 'timestamps']
#   isDefault     模态默认 provider（project-compat 路径请求无 model 时兜底）
#                 同模态最多 1 个 isDefault: true；冲突时启动期 process.exit(1)
#                 0 个时回退为该模态首个 enabled provider（启动日志 WARN）

providers:
  - id: deepseek
    modality: chat
    modelIds:
      - deepseek-chat
    baseUrl: '${env:DEEPSEEK_BASE_URL:-https://api.deepseek.com}'
    apiKey: '${env:DEEPSEEK_API_KEY}'
    capabilities:
      - stream
    isDefault: true

  - id: mock-echo
    modality: chat
    modelIds:
      - mock-echo-1
    baseUrl: 'internal://mock-echo'
    apiKey: ''
    capabilities:
      - stream

  - id: openai-compat-asr
    modality: asr
    modelIds:
      - whisper-1
    baseUrl: '${env:GATEWAY_ASR_BASE_URL:-https://api.openai.com}'
    apiKey: '${env:GATEWAY_ASR_API_KEY}'
    capabilities:
      - timestamps
    isDefault: true

  - id: openai-compat-tts
    modality: tts
    modelIds:
      - tts-1
    baseUrl: '${env:GATEWAY_TTS_BASE_URL:-https://api.openai.com}'
    apiKey: '${env:GATEWAY_TTS_API_KEY}'
    capabilities: []
    isDefault: true

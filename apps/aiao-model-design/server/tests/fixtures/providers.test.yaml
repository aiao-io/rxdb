# 测试专用 providers 配置：仅含 mock-* 实现，避免真实上游 health check
providers:
  - id: mock-echo
    modality: chat
    modelIds:
      - mock-echo-1
    baseUrl: 'internal://mock-echo'
    apiKey: ''
    capabilities:
      - stream
    isDefault: true

  - id: mock-asr
    modality: asr
    modelIds:
      - mock-asr-1
    baseUrl: 'internal://mock-asr'
    apiKey: ''
    capabilities:
      - timestamps
    isDefault: true

  - id: mock-tts
    modality: tts
    modelIds:
      - mock-tts-1
    baseUrl: 'internal://mock-tts'
    apiKey: ''
    capabilities: []
    isDefault: true

  - id: mock-tts-ref
    modality: tts
    modelIds:
      - mock-tts-ref-1
    baseUrl: 'internal://mock-tts-ref'
    apiKey: ''
    capabilities:
      - reference_voice

<div
  class="bg-base-200 border-base-300 flex min-h-14 items-center gap-1 border-b px-2 py-1 lg:hidden"
  [attr.aria-label]="t().toolbar.ariaViewMode"
  role="toolbar"
>
  <button
    class="btn btn-ghost btn-square min-h-11 min-w-11"
    [attr.aria-label]="t().toolbar.openNavigator"
    (click)="openNavigator.emit()"
    type="button"
  >
    <lucide-icon class="h-5 w-5" [img]="PanelLeft" aria-hidden="true" />
  </button>

  <button
    class="btn btn-ghost min-h-11 min-w-0 flex-1 justify-start truncate px-2 text-sm font-semibold"
    [attr.aria-label]="t().toolbar.switchModel"
    [title]="t().toolbar.switchModel"
    (click)="switchModel.emit()"
    type="button"
  >
    <span class="truncate">{{ modelName() ?? t().toolbar.untitled }}</span>
  </button>

  <div class="join shrink-0" [attr.aria-label]="t().toolbar.ariaViewMode" role="group">
    <button
      class="btn join-item min-h-11 px-3"
      [attr.aria-pressed]="viewMode() === 'canvas'"
      [class.btn-active]="viewMode() === 'canvas'"
      (click)="viewModeChange.emit('canvas')"
      type="button"
    >
      {{ t().toolbar.canvas }}
    </button>
    <button
      class="btn join-item min-h-11 px-3"
      [attr.aria-pressed]="viewMode() === 'table'"
      [class.btn-active]="viewMode() === 'table'"
      (click)="viewModeChange.emit('table')"
      type="button"
    >
      {{ t().toolbar.table }}
    </button>
  </div>

  <details class="dropdown dropdown-end shrink-0" #mobileActions>
    <summary class="btn btn-ghost btn-square min-h-11 min-w-11 list-none" [attr.aria-label]="t().toolbar.moreActions">
      <lucide-icon class="h-5 w-5" [img]="MoreHorizontal" aria-hidden="true" />
    </summary>
    <ul class="menu dropdown-content bg-base-100 border-base-300 z-50 mt-1 w-56 border p-2 shadow-lg">
      <li>
        <button (click)="addEntity.emit(); closeMobileActions(mobileActions)" type="button">
          <lucide-icon class="h-4 w-4" [img]="Plus" aria-hidden="true" />
          {{ t().toolbar.addEntity }}
        </button>
      </li>
      <li>
        <button [disabled]="undoDisabled()" (click)="undo.emit(); closeMobileActions(mobileActions)" type="button">
          <lucide-icon class="h-4 w-4" [img]="Undo2" aria-hidden="true" />
          {{ t().toolbar.undo }}
          @if (undoCount(); as count) {
            <span class="badge badge-sm ml-auto">{{ count }}</span>
          }
        </button>
      </li>
      <li>
        <button [disabled]="redoDisabled()" (click)="redo.emit(); closeMobileActions(mobileActions)" type="button">
          <lucide-icon class="h-4 w-4" [img]="Redo2" aria-hidden="true" />
          {{ t().toolbar.redo }}
          @if (redoCount(); as count) {
            <span class="badge badge-sm ml-auto">{{ count }}</span>
          }
        </button>
      </li>
      <li>
        <button (click)="generateCode.emit(); closeMobileActions(mobileActions)" type="button">
          <lucide-icon class="h-4 w-4" [img]="Code2" aria-hidden="true" />
          {{ t().toolbar.generate }}
        </button>
      </li>
      <li>
        <button (click)="generateSql.emit(); closeMobileActions(mobileActions)" type="button">
          <lucide-icon class="h-4 w-4" [img]="FileCode2" aria-hidden="true" />
          {{ t().toolbar.generateSql }}
        </button>
      </li>
      <li>
        <button (click)="compareSql.emit(); closeMobileActions(mobileActions)" type="button">
          <lucide-icon class="h-4 w-4" [img]="GitCompareArrows" aria-hidden="true" />
          {{ t().toolbar.compareSql }}
        </button>
      </li>
      <li>
        <button
          [disabled]="executeDisabled()"
          (click)="executeSql.emit(); closeMobileActions(mobileActions)"
          type="button"
        >
          <lucide-icon class="h-4 w-4" [img]="DatabaseZap" aria-hidden="true" />
          {{ t().toolbar.executeSql }}
        </button>
      </li>
      <li>
        <button (click)="openVersionManager.emit(); closeMobileActions(mobileActions)" type="button">
          <lucide-icon class="h-4 w-4" [img]="History" aria-hidden="true" />
          {{ t().toolbar.versionManager }}
        </button>
      </li>
      <li>
        <button (click)="toggleAi.emit(); closeMobileActions(mobileActions)" type="button">
          <lucide-icon class="h-4 w-4" [img]="BotMessageSquare" aria-hidden="true" />
          AI
        </button>
      </li>
    </ul>
  </details>
</div>

<div
  class="bg-base-200 border-base-300 hidden min-h-10 items-center gap-2 border-b px-4 py-2 lg:flex"
  [attr.aria-label]="t().toolbar.ariaViewMode"
  role="toolbar"
>
  <button
    class="btn btn-ghost btn-xs max-w-48 truncate text-sm font-semibold"
    [attr.aria-label]="t().toolbar.switchModel"
    [title]="t().toolbar.switchModel"
    (click)="switchModel.emit()"
    type="button"
  >
    {{ modelName() ?? t().toolbar.untitled }}
  </button>

  <div class="flex-1"></div>

  <div class="join" [attr.aria-label]="t().toolbar.ariaViewMode" role="group">
    <button
      class="btn join-item btn-xs"
      [attr.aria-pressed]="viewMode() === 'canvas'"
      [class.btn-active]="viewMode() === 'canvas'"
      (click)="viewModeChange.emit('canvas')"
      type="button"
    >
      {{ t().toolbar.canvas }}
    </button>
    <button
      class="btn join-item btn-xs"
      [attr.aria-pressed]="viewMode() === 'table'"
      [class.btn-active]="viewMode() === 'table'"
      (click)="viewModeChange.emit('table')"
      type="button"
    >
      {{ t().toolbar.table }}
    </button>
  </div>

  <div class="divider divider-horizontal mx-0.5 h-5 self-center"></div>
  <button class="btn btn-primary btn-xs" (click)="addEntity.emit()" type="button">
    {{ t().toolbar.addEntity }}
  </button>
  <div class="divider divider-horizontal mx-0.5 h-5 self-center"></div>

  <button
    class="btn btn-ghost btn-xs"
    [attr.aria-label]="t().toolbar.undo"
    [disabled]="undoDisabled()"
    (click)="undo.emit()"
    type="button"
  >
    <lucide-icon class="h-3.5 w-3.5" [img]="Undo2" aria-hidden="true" />
    @if (undoCount(); as count) {
      <span class="badge badge-xs">{{ count }}</span>
    }
  </button>
  <button
    class="btn btn-ghost btn-xs"
    [attr.aria-label]="t().toolbar.redo"
    [disabled]="redoDisabled()"
    (click)="redo.emit()"
    type="button"
  >
    <lucide-icon class="h-3.5 w-3.5" [img]="Redo2" aria-hidden="true" />
    @if (redoCount(); as count) {
      <span class="badge badge-xs">{{ count }}</span>
    }
  </button>

  <div class="divider divider-horizontal mx-0.5 h-5 self-center"></div>
  <button class="btn btn-ghost btn-xs" (click)="generateCode.emit()" type="button">
    {{ t().toolbar.generate }}
  </button>
  <button class="btn btn-ghost btn-xs" (click)="generateSql.emit()" type="button">
    {{ t().toolbar.generateSql }}
  </button>
  <button class="btn btn-ghost btn-xs" (click)="compareSql.emit()" type="button">
    {{ t().toolbar.compareSql }}
  </button>
  <button
    class="btn btn-ghost btn-xs"
    [attr.aria-label]="t().toolbar.executeSql"
    [disabled]="executeDisabled()"
    [title]="t().toolbar.executeSql"
    (click)="executeSql.emit()"
    type="button"
  >
    <lucide-icon class="h-3.5 w-3.5" [img]="DatabaseZap" aria-hidden="true" />
    {{ t().toolbar.executeSql }}
  </button>
  <button
    class="btn btn-ghost btn-xs"
    [attr.aria-label]="t().toolbar.versionManager"
    (click)="openVersionManager.emit()"
    type="button"
  >
    <lucide-icon class="h-3.5 w-3.5" [img]="History" aria-hidden="true" />
    {{ t().toolbar.versionManager }}
  </button>

  <div class="divider divider-horizontal mx-0.5 h-5 self-center"></div>
  <button class="btn btn-accent btn-xs" (click)="toggleAi.emit()" type="button">
    <lucide-icon class="h-3.5 w-3.5" [img]="BotMessageSquare" aria-hidden="true" />
    AI
  </button>
</div>

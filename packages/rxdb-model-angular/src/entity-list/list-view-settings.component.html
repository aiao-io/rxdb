<div class="flex shrink-0 items-center gap-1" #settings [attr.aria-label]="t('text.6b86260762')">
  <div>
    <button class="btn btn-ghost btn-sm" [attr.popovertarget]="uid + '-fields'" type="button">
      {{ t('text.1d83b16aa6') }}
    </button>
    <div
      [attr.aria-label]="t('text.084463effd')"
      [class]="panel"
      [id]="uid + '-fields'"
      data-list-view-popover
      popover="auto"
      role="group"
    >
      <p class="mb-2 text-xs opacity-60">{{ t('text.d6e9f3d96d') }}</p>
      <div data-list-view-fields>
        @for (field of fields(); track field.field) {
          <div
            class="border-base-300 data-[drop-target=true]:border-primary flex h-10 items-center gap-2 border-b-2 border-transparent data-[dragging]:opacity-40"
            data-list-view-field
          >
            <button
              class="btn btn-ghost btn-xs cursor-grab touch-none active:cursor-grabbing"
              [attr.aria-label]="t('text.0c6b22a75a') + field.title + t('text.a96c9a8541')"
              [attr.data-list-view-drag]="field.field"
              [title]="t('text.ed04121b89')"
              type="button"
            >
              <span aria-hidden="true">⠿</span>
            </button>
            <label class="flex min-w-0 flex-1 items-center justify-between gap-3 text-sm">
              <span class="truncate">{{ field.title }}</span>
              <input
                class="toggle toggle-xs shrink-0"
                [attr.aria-label]="t('text.4e1449e7d5') + field.title"
                [checked]="!value().hiddenFields.includes(field.field)"
                [disabled]="visibleCount() === 1 && !value().hiddenFields.includes(field.field)"
                (change)="toggleField(field.field, $event)"
                role="switch"
                type="checkbox"
              />
            </label>
          </div>
        }
      </div>
      <button class="btn btn-ghost btn-sm mt-2" (click)="change({ fieldOrder: [], hiddenFields: [] })" type="button">
        {{ t('text.7879eb052a') }}
      </button>
    </div>
  </div>
  <div>
    <button
      class="btn btn-ghost btn-sm"
      [attr.popovertarget]="uid + '-sorts'"
      [class.btn-active]="value().sorts.length > 0"
      type="button"
    >
      {{ t('text.5a02694e20', { p0: value().sorts.length ? ` ${value().sorts.length}` : '' }) }}
    </button>
    <div
      [attr.aria-label]="t('text.71b3e13c24')"
      [class]="panel"
      [id]="uid + '-sorts'"
      data-list-view-popover
      popover="auto"
      role="group"
    >
      <p class="mb-2 text-xs opacity-60">{{ t('text.4562165f63') }}</p>
      @for (sort of value().sorts; track sort.field; let index = $index) {
        <div class="mb-2 flex items-center gap-1">
          <span class="min-w-0 flex-1 truncate text-sm">{{ index + 1 }}. {{ titleOf(sort.field) }}</span>
          <select
            class="select select-xs w-20"
            [attr.aria-label]="t('text.826e3ac40e', { p0: titleOf(sort.field) })"
            [value]="sort.sort"
            (change)="sortDirection(sort.field, $event)"
          >
            <option value="asc">{{ t('text.ca715c0d8d') }}</option>
            <option value="desc">{{ t('text.4b77c35468') }}</option>
          </select>
          <button
            class="btn btn-ghost btn-xs"
            [attr.aria-label]="t('text.64105f43ad', { p0: titleOf(sort.field) })"
            [disabled]="index === 0"
            (click)="moveSort(index, -1)"
            type="button"
          >
            ↑
          </button>
          <button
            class="btn btn-ghost btn-xs"
            [attr.aria-label]="t('text.30fdff6ce3', { p0: titleOf(sort.field) })"
            [disabled]="index === value().sorts.length - 1"
            (click)="moveSort(index, 1)"
            type="button"
          >
            ↓
          </button>
          <button
            class="btn btn-ghost btn-xs"
            [attr.aria-label]="t('text.400dd902e6', { p0: titleOf(sort.field) })"
            (click)="removeSort(sort.field)"
            type="button"
          >
            ×
          </button>
        </div>
      }
      <select
        class="select select-sm w-full"
        [attr.aria-label]="t('text.e14e86ebc3')"
        [disabled]="!available().length"
        (change)="addSort($event)"
        value=""
      >
        <option value="">{{ t('text.e14e86ebc3') }}</option>
        @for (field of available(); track field.field) {
          <option [value]="field.field">{{ field.title }}</option>
        }
      </select>
      <button
        class="btn btn-ghost btn-sm mt-2"
        [disabled]="!value().sorts.length"
        (click)="change({ sorts: [] })"
        type="button"
      >
        {{ t('text.cdf8bcd4bf') }}
      </button>
    </div>
  </div>
  <div>
    <button
      class="btn btn-ghost btn-sm"
      [attr.popovertarget]="uid + '-group'"
      [class.btn-active]="value().groupBy !== null"
      type="button"
    >
      {{ t('text.51cbff10d1', { p0: value().groupBy ? ' 1' : '' }) }}
    </button>
    <div
      [attr.aria-label]="t('text.0dbd9be387')"
      [class]="panel"
      [id]="uid + '-group'"
      data-list-view-popover
      popover="auto"
      role="group"
    >
      <label class="mb-2 block text-sm">
        {{ t('text.d9c96ad4bd') }}
        <select
          class="select select-sm mt-2 w-full"
          [attr.aria-label]="t('text.d9c96ad4bd')"
          [value]="value().groupBy ?? ''"
          (change)="group($event)"
        >
          <option value="">{{ t('text.fcd40ee3f0') }}</option>
          @for (field of sortable(); track field.field) {
            <option [value]="field.field">{{ field.title }}</option>
          }
        </select>
      </label>
      <p class="text-xs opacity-60">{{ t('text.02e429a961') }}</p>
    </div>
  </div>
</div>

<ng-template #link let-node>
  <a
    class="btn btn-ghost btn-sm"
    [attr.aria-current]="isActive(node.route) ? 'page' : null"
    [attr.data-testid]="node.testId ?? 'admin-header-link'"
    [attr.href]="node.route"
    [class.btn-active]="isActive(node.route)"
    (click)="go($event, node)"
  >
    @if (node.icon) {
      <svg [lucideIcon]="node.icon" [size]="16"></svg>
    }
    {{ node.label }}
  </a>
</ng-template>

<nav class="admin-header-menu" [attr.aria-label]="t('layout.navigation')" data-testid="admin-header-menu">
  @for (node of nodes(); track node.id) {
    @if (node.children?.length) {
      <div class="dropdown dropdown-hover">
        <div class="btn btn-ghost btn-sm" role="button" tabindex="0">
          @if (node.icon) {
            <svg [lucideIcon]="node.icon" [size]="16"></svg>
          }
          {{ node.label }}
          <svg [lucideIcon]="ChevronDown" [size]="14"></svg>
        </div>
        <ul class="dropdown-content menu bg-base-100 rounded-box z-50 w-52 p-2 shadow" tabindex="0">
          @for (child of node.children; track child.id) {
            <li>
              <ng-container [ngTemplateOutlet]="link" [ngTemplateOutletContext]="{ $implicit: child }" />
            </li>
          }
        </ul>
      </div>
    } @else {
      <ng-container [ngTemplateOutlet]="link" [ngTemplateOutletContext]="{ $implicit: node }" />
    }
  }
</nav>

# 本地预演栈的静态站点（ADMIN-US-217），对应生产的三端静态托管：
# - 4510 / 4511 / 4512：React / Angular / Vue 的当前版本（`.state/current` → releases/<发布 ID>）；
# - 4513 / 4514 / 4515：同样三端的发布预览（`.state/staged` → 正在发布的 releases/<发布 ID>），流水线在切换 current 之前对它做健康检查；
# - 8080（不发布到宿主机）：只给 GoTrue 读取验证码邮件模板。
# current / staged 是 `.state` 里的相对符号链接，nginx 每个请求都按路径重新解析，流水线原子替换链接即完成切换，不用重启。
# `/collaboration-api/*` 改写到函数网关，与生产静态站点的规则一致（Netlify：`/collaboration-api/* <函数地址>/:splat 200`）。

# 网关按服务名解析（docker 内置 DNS），网关重建换了地址也能找到
resolver 127.0.0.11 valid=10s ipv6=off;

map $server_port $release_root {
  4510 /srv/state/current/web/react;
  4511 /srv/state/current/web/angular;
  4512 /srv/state/current/web/vue;
  4513 /srv/state/staged/web/react;
  4514 /srv/state/staged/web/angular;
  4515 /srv/state/staged/web/vue;
}

server {
  listen 4510;
  listen 4511;
  listen 4512;
  listen 4513;
  listen 4514;
  listen 4515;
  server_name _;
  root $release_root;
  # 协作命令请求体上限 4 MiB（单个提交最多 10000 项变更），网关前面再放宽一点
  client_max_body_size 5m;
  # sqlite-wasm 等模块脚本：.mjs 也按 JavaScript 下发（浏览器对模块脚本做严格 MIME 检查）
  include /etc/nginx/mime.types;
  types {
    application/javascript mjs;
  }

  location /collaboration-api/ {
    set $gateway http://kong:8000;
    rewrite ^/collaboration-api/(.*)$ /functions/v1/admin-collaboration/$1 break;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_read_timeout 150s;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    # 前端路由：没有对应文件的路径都回 index.html
    try_files $uri $uri/ /index.html;
    add_header Cache-Control 'no-cache' always;
  }
}

server {
  listen 8080;
  server_name templates;
  root /srv/templates;
}

# 本地预演栈的 API 网关（ADMIN-US-217），对应托管 Supabase 的 https://<ref>.supabase.co：
#   /auth/v1/*、/rest/v1/*、/realtime/v1/* 要求 apikey（anon 或 service role），与托管一致；
#   /functions/v1/* 不在网关校验（相当于 `supabase functions deploy --no-verify-jwt`），命令入口自己本地验签；
#   /auth/v1/.well-known/jwks.json 公开（托管 Supabase 的 JWKS 地址同样不要求 apikey），命令入口按它验 ES256 令牌。
# `${ANON_KEY}`、`${SERVICE_ROLE_KEY}` 由 deploy/scripts/local-stack.mjs 从 .env.local 填入，生成的 .state/kong.yml 不进仓库。
_format_version: '3.0'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: '${ANON_KEY}'
    acls:
      - group: anon
  - username: service_role
    keyauth_credentials:
      - key: '${SERVICE_ROLE_KEY}'
    acls:
      - group: admin

plugins:
  - name: cors
    config:
      # 三端工作台：当前版本 4510～4512，发布前的预览 4513～4515
      origins:
        - http://127.0.0.1:4510
        - http://127.0.0.1:4511
        - http://127.0.0.1:4512
        - http://127.0.0.1:4513
        - http://127.0.0.1:4514
        - http://127.0.0.1:4515
        - http://localhost:4510
        - http://localhost:4511
        - http://localhost:4512
      methods: [GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS]
      headers:
        [
          Accept,
          Authorization,
          Content-Type,
          apikey,
          Prefer,
          Range,
          X-Client-Info,
          X-Supabase-Api-Version,
          Accept-Profile,
          Content-Profile,
          X-Retry-Count
        ]
      exposed_headers:
        [Content-Range, X-Supabase-Api-Version, Accept-Profile, Content-Profile, Retry-After, Server-Timing]
      credentials: false
      max_age: 3600

services:
  - name: auth-v1-open-verify
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open-verify
        paths: ['/auth/v1/verify']
        strip_path: true
  - name: auth-v1-open-jwks
    url: http://auth:9999/.well-known/jwks.json
    routes:
      - name: auth-v1-open-jwks
        paths: ['/auth/v1/.well-known/jwks.json']
        strip_path: true
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1
        paths: ['/auth/v1/']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1
        paths: ['/rest/v1/']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
  - name: realtime-v1-ws
    url: http://realtime-dev.supabase-realtime:4000/socket
    routes:
      - name: realtime-v1-ws
        paths: ['/realtime/v1/']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
  - name: realtime-v1-rest
    url: http://realtime-dev.supabase-realtime:4000/api
    routes:
      - name: realtime-v1-rest
        paths: ['/realtime/v1/api']
        strip_path: true
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
  - name: functions-v1
    url: http://functions:9000/
    # 函数墙钟上限 150 秒（同托管）；网关默认 60 秒读超时会先于函数断开
    read_timeout: 150000
    routes:
      - name: functions-v1
        paths: ['/functions/v1/']
        strip_path: true

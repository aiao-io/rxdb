;; 本地预演栈的连接池（ADMIN-US-217）：生产里命令入口经 Supavisor 的 transaction 模式（6543 端口）连库，本机没有 Supavisor 镜像，
;; 用 transaction 模式的 PgBouncer 1.26.1（与契约测试同一个固定摘要的镜像）预演同样的约束：连接不保留会话状态、
;; 不转发启动参数、不支持跨事务的预编译语句。口令文件 userlist.txt 由 deploy/scripts/local-stack.mjs 按 .env.local 生成，
;; 与本文件一起放在 .state/pgbouncer/（不进仓库）。
[databases]
postgres = host=db port=5432 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
;; 每个（库，用户）的服务端连接数：与 Supavisor 小规格项目的默认池大小同一量级
default_pool_size = 15
min_pool_size = 0
reserve_pool_size = 0
max_client_conn = 200
;; 排队等服务端连接的上限（秒）：超过即报 query_wait_timeout，命令入口按可重试的 503 回应
query_wait_timeout = 10
max_prepared_statements = 0

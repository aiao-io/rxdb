<div class="tb plain" data-drag>
  <div class="title" data-webapp-title>{{ win.title() }}</div>
  <div class="tbz"><app-traffic-lights /></div>
  <div class="grow"></div>
  <div class="tbz"></div>
</div>
<div class="webapp" [attr.data-webapp]="app.id" [attr.data-webapp-state]="state()">
  <div class="webapp-stage" #stage></div>
  @switch (state()) {
    @case ('loading') {
      <div class="webapp-status" role="status">
        <svg class="webapp-icon" [appIcon]="app.icon"></svg>
        <div class="webapp-spinner"></div>
        <p>Opening {{ app.name }}…</p>
      </div>
    }
    @case ('failed') {
      <div class="webapp-status" role="alert">
        <svg class="webapp-icon" [appIcon]="app.icon"></svg>
        <h2>“{{ app.name }}” can’t be opened.</h2>
        <p data-webapp-reason>{{ reason() }}</p>
        <div class="webapp-actions">
          <button class="btn pri" type="button" (click)="retry()" data-webapp-retry>Try Again</button>
          <a class="btn" [href]="app.web.url" target="_blank" rel="noopener" data-webapp-open>Open in New Tab</a>
        </div>
      </div>
    }
  }
  @if (shielded()) {
    <div class="webapp-shield" (pointerdown)="activate()" data-webapp-shield></div>
  }
</div>

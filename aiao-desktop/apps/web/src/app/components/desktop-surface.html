<!-- 删除图标后，临时接住焦点，让桌面收到撤销快捷键。 -->
<div
  id="desktop"
  #surface
  [appFileDrop]="desktopPath"
  (contextmenu)="surfaceMenu($event)"
  (pointerdown)="pressSurface($event)"
  aria-label="Desktop"
  role="group"
  tabindex="-1"
>
  <div id="dwidgets">
    <app-calendar-widget />
    <app-weather-widget />
    <app-stocks-widget />
  </div>
  <div id="marquee" #marquee aria-hidden="true"></div>
  @for (item of desktop.items(); track item.node?.id ?? item.id) {
    @let at = position(item);
    @let moving = movingToDirectory().has(item.id);
    <div
      class="dicon"
      [appFileDrop]="item.node?.kind === 'folder' ? item.node.path : undefined"
      [attr.data-id]="item.id"
      [class.drag]="dragging()?.id === item.id"
      [class.drop-target]="folderHover() === item.id"
      [class.moving]="moving"
      [class.sel]="selected().has(item.id)"
      [class.settle]="settling() === item.id"
      [style.left.px]="at.left"
      [style.top.px]="at.top"
      (animate.leave)="leaveIcon($event, item)"
      (contextmenu)="iconMenu($event, item)"
      (dblclick)="item.open()"
      (focus)="focusItem(item.id)"
      (keydown.enter)="item.open()"
      (keydown.space)="openByKey($event, item)"
      (keydown)="iconKey($event, item)"
      (pointerdown)="grab($event, item)"
      role="button"
      tabindex="0"
    >
      <div class="art">
        @if (item.node?.kind === 'folder' && folderHover() === item.id) {
          <svg appIcon="g-folder-open"></svg>
        } @else if (item.node?.icon === 'f-img') {
          <app-file-thumbnail [contentId]="item.node.contentId" />
        } @else {
          <svg [appIcon]="item.icon"></svg>
        }
      </div>
      <div class="lbl">{{ item.name }}</div>
    </div>
  }
</div>

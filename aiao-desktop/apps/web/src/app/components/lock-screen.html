<div
  class="nosel"
  id="lock"
  [attr.data-on]="dataOn()"
  [class.opening]="phase() === 'opening' || phase() === 'out'"
  [class.out]="phase() === 'out'"
  [hidden]="phase() === 'hidden'"
  (click)="session.unlock()"
  (keydown.enter)="session.unlock()"
  tabindex="-1"
>
  <div class="lk-wall" [style.background-image]="wall()"></div>
  <div class="lk-top">
    <div class="lk-date">{{ date() }}</div>
    <div class="lk-time">{{ time() }}</div>
  </div>
  <div class="lk-user">
    <div class="lk-av" [style.background-image]="avatar" data-av></div>
    <div class="lk-name">{{ system.user }}</div>
    <div class="lk-pw">
      <span>Enter Password</span>
      <i></i>
    </div>
    <div class="lk-hint">Click to log in</div>
  </div>
  <div class="lk-foot"></div>
</div>

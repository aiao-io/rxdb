<div id="stage">
  <app-wallpaper></app-wallpaper>
  <app-desktop-surface></app-desktop-surface>
  <app-window-layer></app-window-layer>
  <app-menubar></app-menubar>
  <app-dock></app-dock>
  <app-overlay-layer></app-overlay-layer>
  <app-lock-screen></app-lock-screen>
  <app-boot-screen></app-boot-screen>
  <app-data-problem></app-data-problem>
  <div id="toast" [class.on]="toast.visible()">{{ toast.message() }}</div>
</div>
@if (session.sleep() !== 'awake') {
  <div id="sleeper" [class.wake]="session.sleep() === 'waking'"></div>
}
<app-icon-sprite></app-icon-sprite>

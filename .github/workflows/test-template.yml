name: Test Template (Reusable)

on:
  workflow_call:
    inputs:
      run_mode:
        description: 'Nx 运行模式: affected（仅受影响）或 run-many（全部）'
        required: true
        type: string
      include_e2e:
        description: '是否包含 E2E 测试'
        required: false
        type: boolean
        default: true
      need_supabase:
        description: '是否需要启动 Supabase'
        required: false
        type: boolean
        default: true
      is_pr:
        description: '是否为 PR 环境（用于某些条件步骤）'
        required: false
        type: boolean
        default: false
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      CODECOV_TOKEN:
        required: true

env:
  VITE_SUPABASE_URL: http://localhost:54331
  VITE_SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE
  CI: true
  NX_DAEMON: false
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  test:
    runs-on: ubuntu-latest
    # 45min 兜底：pglite/wa-sqlite 已并行化后 job 应稳落 30min 内，
    # 此上限用于吸收 e2e / 缓存未命中 / 并行未达预期时的波动，避免再次被硬掐。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      # 释放磁盘空间：ubuntu-latest 根分区可用空间有限，
      # node_modules + Playwright 浏览器 + Supabase 镜像 + 全量构建/测试缓存会写满根分区，
      # 曾导致 Chromium 因 /tmp 共享内存归零而崩溃、rolldown 报 ENOSPC（os error 28）。
      # 删除 runner 预装且本仓库用不到的工具链，可释放约 16-19GB。
      - name: Free disk space
        run: |
          echo "📊 Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup
          echo "📊 Disk after cleanup:"
          df -h /

      - name: Fetch Main
        if: ${{ inputs.is_pr }}
        run: git fetch origin main:main

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: pnpm/action-setup@v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            .nvmrc

      - run: pnpm install --frozen-lockfile

      # Nx 本地缓存。两个作用：
      # 1. 落盘给同一 run 里后置的 e2e job（e2e-template.yml）恢复 ——
      #    e2e target `dependsOn: <app>:build`，否则要把被测应用整个重建一遍；
      # 2. restore-keys 回退让每次 run 都能暖到上一轮的缓存（此前 CI 是纯冷跑：
      #    nx.json 有 nxCloudId，但工作流里没有 NX_CLOUD_ACCESS_TOKEN）。
      # 只缓存 .nx/cache，不碰 .nx/workspace-data（project graph 缓存，跨 run 复用有陈旧风险）。
      # nx 的 hash 机制保证陈旧缓存只会 miss，不会用错产物。
      - name: Cache Nx
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nx-cache-${{ runner.os }}-

      # 三端绑定 README parity 校验（spec/005 FR-012 / SC-004）
      # 三份 README 的 Parity Matrix 表「能力」列必须完全一致 + 5 必备段在前 60 行
      # 验证 Nx 项目图
      - name: Validate Nx Project Graph
        timeout-minutes: 1
        run: |
          set -e
          echo "🔍 Validating Nx project graph..."
          if pnpm exec nx show projects; then
            echo "✅ Project graph is valid!"
          else
            echo ""
            echo "❌ Project graph validation failed!"
            echo ""
            echo "📋 Nx Report:"
            pnpm exec nx report || true
            exit 1
          fi

      # API 表面基线门禁：公开包导出发生未声明变化时失败
      # 放在此处实现 fail-fast，无需等待 Supabase/Playwright/构建
      - name: API surface gate
        run: node scripts/audit/api-surface.mjs --check

      - uses: nrwl/nx-set-shas@v5

      # 智能判断是否需要 E2E（仅在 affected 模式下）
      - name: Check if E2E is needed
        id: check-e2e
        if: ${{ inputs.run_mode == 'affected' && inputs.include_e2e }}
        run: |
          echo "🔍 Checking affected e2e projects..."
          # 必须走 --json + jq 数长度：`nx show projects` 在非 TTY 下输出 JSON 数组，
          # 空集是字面量 `[]` 而非空串，`[ -z ... ]` 会永远为假。
          AFFECTED_E2E=$(pnpm exec nx show projects --affected -t e2e --exclude=website,benchmarks --json 2>/dev/null || echo '[]')

          if [ "$(echo "$AFFECTED_E2E" | jq 'length' 2>/dev/null || echo 0)" -eq 0 ]; then
            echo "⏭️ No e2e projects affected"
            echo "need_e2e=false" >> $GITHUB_OUTPUT
          else
            echo "✅ E2E affected: $AFFECTED_E2E"
            echo "need_e2e=true" >> $GITHUB_OUTPUT
          fi

      # 智能判断是否需要 Supabase（test 和 e2e 都可能需要）
      - name: Check if Supabase is needed
        id: check-supabase
        if: ${{ inputs.run_mode == 'affected' }}
        run: |
          echo "🔍 Checking if Supabase is needed..."
          AFFECTED_ALL=$(pnpm exec nx show projects --affected -t test,e2e,e2e-remote --exclude=website,benchmarks 2>/dev/null || echo "")

          # 远端同步 E2E 使用同一套本地 Supabase 栈；本地-only target 不触发它。
          if echo "$AFFECTED_ALL" | grep -qE "(dev-rxdb-supabase-e2e|rxdb-adapter-supabase)"; then
            echo "✅ Supabase affected"
            echo "need_supabase=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Supabase not affected"
            echo "need_supabase=false" >> $GITHUB_OUTPUT
          fi

      # 启动 Supabase（优化：缓存 Docker 镜像）
      - name: Determine Supabase requirement
        id: supabase-check
        run: |
          if [ "${{ inputs.need_supabase }}" = "true" ] && \
             ([ "${{ inputs.run_mode }}" = "run-many" ] || [ "${{ steps.check-supabase.outputs.need_supabase }}" = "true" ]); then
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache Supabase Docker images
        if: steps.supabase-check.outputs.needed == 'true'
        uses: actions/cache@v5
        with:
          path: /var/lib/docker
          key: docker-supabase-${{ runner.os }}-${{ hashFiles('docker/docker-compose.ci.yml') }}
          restore-keys: |
            docker-supabase-${{ runner.os }}-

      - name: Start Supabase
        if: steps.supabase-check.outputs.needed == 'true'
        working-directory: docker
        run: |
          echo "📦 Pulling Docker images..."
          docker compose -f docker-compose.ci.yml pull
          echo "✅ Images pulled!"

          echo "🚀 Starting containers..."
          docker compose -f docker-compose.ci.yml up -d

          # 等待 PostgreSQL
          echo "⏳ Waiting for PostgreSQL..."
          timeout 60 bash -c 'until docker exec supabase-db pg_isready -U postgres -q; do sleep 1; done'
          echo "✅ PostgreSQL is ready!"

          # 初始化数据库
          echo "🔧 Initializing database..."
          docker exec -i supabase-db psql -U postgres -d postgres < sql/01-rxdb-system-tables.sql
          docker exec -i supabase-db psql -U postgres -d postgres < sql/02-rxdb-sync-functions.sql
          docker exec -i supabase-db psql -U postgres -d postgres < sql/03-business-tables.sql
          docker exec -i supabase-db psql -U postgres -d postgres < sql/04-rxdb-utils-functions.sql
          echo "✅ Database initialized!"

          # 等待 REST API
          echo "⏳ Waiting for REST API..."
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE"

          for i in {1..60}; do
            if curl -sf -H "apikey: $ANON_KEY" http://localhost:54331/rest/v1/ >/dev/null 2>&1; then
              echo "✅ Supabase ready! (${i}s)"
              exit 0
            fi
            [ $((i % 10)) -eq 0 ] && echo "⏳ Still waiting... (${i}s)"
            sleep 1
          done

          echo "❌ Supabase failed to start after 60s"
          docker ps -a --format "table {{.Names}}\t{{.Status}}" | grep supabase
          docker logs supabase-kong --tail 20 2>&1
          docker logs supabase-rest --tail 20 2>&1
          exit 1

      # 缓存 Playwright 浏览器（test 和 e2e 都需要）
      - name: Get Playwright version
        id: playwright-version
        run: |
          if [ -f "node_modules/@playwright/test/package.json" ]; then
            VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          elif [ -f "node_modules/playwright/package.json" ]; then
            VERSION=$(node -p "require('./node_modules/playwright/package.json').version")
          else
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Playwright version: $VERSION"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      # 预热 project graph
      - name: Warm up Nx project graph
        run: |
          for i in {1..3}; do
            echo "🔄 Attempt $i: Generating project graph..."
            if pnpm exec nx graph --file=/tmp/graph.json; then
              echo "✅ Project graph generated successfully"
              break
            fi
            echo "⚠️ Attempt $i failed, retrying in 5s..."
            pnpm exec nx reset
            sleep 5
          done

      # 构建、检查、测试
      - name: Build, Lint, and Test
        env:
          NX_TUI: false
        run: |
          set -e
          NON_TEST_TASKS="build lint"
          RUN_MODE="${{ inputs.run_mode }}"

          # 判断是否需要 e2e
          if [ "$RUN_MODE" = "affected" ]; then
            if [ "${{ steps.check-e2e.outputs.need_e2e }}" = "true" ]; then
              NON_TEST_TASKS="$NON_TEST_TASKS e2e e2e-remote"
              echo "✅ E2E: affected"
            else
              echo "⏭️ E2E: skipped"
            fi
          elif [ "${{ inputs.include_e2e }}" = "true" ]; then
            NON_TEST_TASKS="$NON_TEST_TASKS e2e e2e-remote"
            echo "✅ E2E: all"
          fi

          echo "🚀 Running: $NON_TEST_TASKS test"
          [ "$RUN_MODE" = "affected" ] && CMD="affected" || CMD="run-many"

          # 先执行非测试任务。Vitest 覆盖率参数不能转发给 eslint/vite/e2e。
          # --parallel=2：GitHub Actions ubuntu-latest 仅 7GB RAM，
          # 4+ Angular 生产构建并行会触发 OOM kill（曾导致 dev-rxdb-tauri 构建静默卡死）。
          pnpm exec nx $CMD -t $NON_TEST_TASKS --exclude=website,benchmarks --output-style=stream --nxBail --parallel=2

          # final + summary 必须同时生成：门禁会从 final 重算原始计数，拒绝损坏或跨代 summary。
          pnpm exec nx $CMD -t test --exclude=website,benchmarks --output-style=stream --nxBail \
            --parallel=2 \
            --coverage --coverage.reporter=json --coverage.reporter=json-summary --coverage.reporter=lcovonly

          # coverage-acceptance 必须单独一条命令（RXT-031）：
          # 它自己驱动多段 vitest 并合并 blob，不能接收上面那行给 test 的 --coverage.* 参数。
          # 曾经这里带着 `--exclude=rxdb-adapter-sqlite-core`（SQLC-038：适配器用例被钉在 Node 环境跑），
          # SQLC-038 收口后已删除该排除项 —— 五个 suite 现在都在 chromium 里跑并全绿。
          pnpm exec nx $CMD -t coverage-acceptance \
            --output-style=stream --nxBail --parallel=2

          # base/head 与 nx-set-shas 对齐，保证与上方 affected 任务同一比较范围
          if [ "$RUN_MODE" = "affected" ]; then
            COVERAGE_PROJECTS=$(pnpm exec nx show projects --affected --withTarget=test --base="${NX_BASE:-origin/main}" --head="${NX_HEAD:-HEAD}" --json | jq -r 'join(",")')
          else
            COVERAGE_PROJECTS=$(pnpm exec nx show projects --withTarget=test --json | jq -r 'join(",")')
          fi
          node scripts/audit/coverage-check.mjs --check --projects="$COVERAGE_PROJECTS"

          # 确保所有后台进程被清理
          jobs -p | xargs -r kill 2>/dev/null || true

      # Search benchmark gate (T073a): PR 触及 packages/* 或 benchmarks/ 时运行基准阈值校验
      # 当前 runner 在 T044 完成前以 stub 模式退出 0；完成后严格按阈值判定
      - name: Search benchmark gate (PR only)
        if: ${{ inputs.is_pr }}
        run: |
          echo "🔍 Detecting changes under packages/ or benchmarks/ ..."
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'packages/' 'benchmarks/' || true)
          if [ -z "$CHANGED" ]; then
            echo "⏭️ No changes under packages/ or benchmarks/; skipping search benchmark gate"
            exit 0
          fi
          echo "✅ Changes detected; running search benchmark gate"
          echo "$CHANGED" | head -20
          pnpm exec nx run benchmarks:search-ci

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aiao-io/aiao
          codecov_yml_path: .github/codecov.yml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aiao-io/aiao
          codecov_yml_path: .github/codecov.yml
          report_type: test_results

      - name: Cleanup Docker
        if: always()
        working-directory: docker
        run: docker compose -f docker-compose.ci.yml down -v

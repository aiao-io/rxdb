name: Aiao Media

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified application to Cloudflare
        type: boolean
        default: false
  pull_request:
    paths:
      - 'apps/aiao-media/**'
      - 'apps/aiao-media-e2e/**'
      - 'packages/rxdb/**'
      - 'packages/rxdb-adapter-wa-sqlite/**'
      - 'packages/rxdb-adapter-supabase/**'
      - 'packages/rxdb-plugin-history/**'
      - 'packages/rxdb-plugin-sync/**'
      - 'packages/rxdb-adapter-sqlite-core/**'
      - 'packages/rxdb-plugin-storage/**'
      - 'packages/utils/**'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/aiao-media.yml'

permissions:
  contents: read

env:
  CI: true
  NX_NO_CLOUD: true
  NX_DAEMON: false
  AIAO_PLAYWRIGHT_CHANNEL: chromium

concurrency:
  group: aiao-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/playwright-chromium
      - name: Check application and e2e
        run: pnpm nx run-many -t lint typecheck -p aiao-media aiao-media-e2e --parallel=2 --output-style=static
      - name: Verify unit and real browser data coverage
        run: pnpm nx run aiao-media:coverage --output-style=static
      - name: Verify browser behavior
        run: pnpm nx run aiao-media-e2e:local-first-e2e --output-style=static
      - name: Verify provider acceptance runner with fixtures
        run: pnpm nx run aiao-media-e2e:provider-acceptance-fixture --output-style=static
      - name: Verify public origin smoke runner with fixtures
        run: pnpm nx run aiao-media-e2e:public-origin-smoke-fixture --output-style=static
      - name: Verify actual release acceptance guards
        run: pnpm nx run aiao-media-e2e:actual-release-update-check --output-style=static
      - name: Verify offline updates and rollback
        run: pnpm nx run aiao-media-e2e:offline-update-e2e --output-style=static
      - name: Verify real local product services and browser behavior
        run: pnpm nx run-many -t product-test product-e2e supabase-e2e -p aiao-media aiao-media-e2e --parallel=1 --output-style=static
      - name: Verify production artifacts
        run: pnpm nx run aiao-media:deploy-check --output-style=static
      - name: Stop application test services
        if: ${{ always() }}
        run: |
          if [ -f apps/aiao-media/infra/supabase/.env ]; then
            pnpm nx run aiao-media:supabase-down --output-style=static
          fi

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: Deploy verified application
        run: pnpm nx run aiao-media:deploy --output-style=static
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AIAO_RELAY_PROVIDER_BASE_URLS: ${{ vars.AIAO_RELAY_PROVIDER_BASE_URLS }}
          AIAO_SUPABASE_URL: ${{ vars.AIAO_SUPABASE_URL }}
          AIAO_SUPABASE_ANON_KEY: ${{ vars.AIAO_SUPABASE_ANON_KEY }}

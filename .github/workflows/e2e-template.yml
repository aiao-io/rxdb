name: E2E Template (Reusable)

# Playwright E2E 独立于 test-template.yml 运行。
#
# 拆分的理由：e2e 原本和 build/lint 挤在同一条 `nx ... --nxBail` 里，
# 一次 Playwright flake 会把整个 PR 检查染红，看不出「代码本身是过的，只是 e2e 抖」。
# 拆开之后 lint/typecheck/test/build 先出结果，e2e 作为独立 check 后置。
#
# 本模板同时运行本地 E2E 与 `dev-rxdb-supabase-e2e:e2e-remote`。
# 只有远端 target 受影响时才启动 Supabase/Docker，避免本地模式白跑整套服务。

on:
  workflow_call:
    inputs:
      run_mode:
        description: 'Nx 运行模式: affected（仅受影响）或 run-many（全部）'
        required: true
        type: string
      is_pr:
        description: '是否为 PR 环境（用于某些条件步骤）'
        required: false
        type: boolean
        default: false

env:
  CI: true
  NX_DAEMON: false
  NODE_OPTIONS: '--max-old-space-size=6144'
  VITE_SUPABASE_URL: http://localhost:54331
  VITE_SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      # 释放磁盘空间：ubuntu-latest 根分区可用空间有限。
      # 曾导致 Chromium 因 /tmp 共享内存归零而崩溃、rolldown 报 ENOSPC（os error 28）。
      # 删除 runner 预装且本仓库用不到的工具链，可释放约 16-19GB。
      - name: Free disk space
        run: |
          echo "📊 Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup
          echo "📊 Disk after cleanup:"
          df -h /

      - name: Fetch Main
        if: ${{ inputs.is_pr }}
        run: git fetch origin main:main

      - uses: pnpm/action-setup@v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            .nvmrc

      - run: pnpm install --frozen-lockfile

      # 只读恢复 test-template.yml 那个 job 落盘的 Nx 本地缓存。
      # e2e target `dependsOn: <app>:build`，没有这一步就要把被测应用整个重建一遍。
      # 用 cache/restore 而不是 cache：本 job 不需要回写，避免和同 key 的写入撞车。
      # 只恢复 .nx/cache，不碰 .nx/workspace-data（project graph 缓存，跨 job 复用有陈旧风险）。
      - name: Restore Nx cache
        uses: actions/cache/restore@v5
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nx-cache-${{ runner.os }}-

      # 预热 project graph（同时充当 graph 有效性校验）
      - name: Warm up Nx project graph
        run: |
          for i in {1..3}; do
            echo "🔄 Attempt $i: Generating project graph..."
            if pnpm exec nx graph --file=/tmp/graph.json; then
              echo "✅ Project graph generated successfully"
              break
            fi
            echo "⚠️ Attempt $i failed, retrying in 5s..."
            pnpm exec nx reset
            sleep 5
          done

      - uses: nrwl/nx-set-shas@v5

      - name: Check if E2E is needed
        id: check-e2e
        run: |
          if [ "${{ inputs.run_mode }}" != "affected" ]; then
            echo "✅ E2E: all (run-many)"
            echo "need_e2e=true" >> $GITHUB_OUTPUT
            echo "need_remote=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔍 Checking affected e2e projects..."
          # 必须走 --json + jq 数长度。`nx show projects` 在非 TTY 下输出的是 JSON 数组，
          # 空集打印的是字面量 `[]` —— 不是空串。用 `[ -z "$OUT" ]` 判空会**永远为假**，
          # 于是「没有受影响的 e2e」这条分支形同虚设。
          AFFECTED_E2E=$(pnpm exec nx show projects --affected -t e2e,e2e-remote --exclude=website,benchmarks --json 2>/dev/null || echo '[]')
          AFFECTED_REMOTE=$(pnpm exec nx show projects --affected -t e2e-remote --exclude=website,benchmarks --json 2>/dev/null || echo '[]')
          COUNT=$(echo "$AFFECTED_E2E" | jq 'length' 2>/dev/null || echo 0)
          REMOTE_COUNT=$(echo "$AFFECTED_REMOTE" | jq 'length' 2>/dev/null || echo 0)
          echo "need_remote=$([ "$REMOTE_COUNT" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

          if [ "$COUNT" -eq 0 ]; then
            echo "⏭️ No e2e projects affected"
            echo "need_e2e=false" >> $GITHUB_OUTPUT
          else
            echo "✅ E2E affected ($COUNT): $(echo "$AFFECTED_E2E" | jq -r 'join(", ")')"
            echo "need_e2e=true" >> $GITHUB_OUTPUT
          fi

      # 缓存 Playwright 浏览器。
      # cache key 里显式写死 `chromium`：四个 e2e config 的 `projects` 目前只启用了 chromium
      # （firefox/webkit 都是注释掉的），所以这里只装 chromium。
      # test-template.yml 那个 job 装的是全套浏览器（test-browser 需要），用的是另一个 key ——
      # **两边的 key 必须保持不同**，否则谁先落盘谁决定缓存内容，另一边会在 cache-hit 分支上
      # 拿到缺浏览器的缓存。将来若某个 e2e config 放开 firefox/webkit，改这里的 key 和安装参数。
      - name: Get Playwright version
        id: playwright-version
        if: steps.check-e2e.outputs.need_e2e == 'true'
        run: |
          if [ -f "node_modules/@playwright/test/package.json" ]; then
            VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          elif [ -f "node_modules/playwright/package.json" ]; then
            VERSION=$(node -p "require('./node_modules/playwright/package.json').version")
          else
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Playwright version: $VERSION"

      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.check-e2e.outputs.need_e2e == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.check-e2e.outputs.need_e2e == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.check-e2e.outputs.need_e2e == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Electron 没有 headless 模式。`dev-rxdb-electron-e2e` 拉起的是 electron-builder 的真实产物，
      # 主进程一定要连上一个 X server —— ubuntu-latest 上没有，于是 Ozone 后端直接放弃：
      #   ERROR:ozone_platform_x11.cc: Missing X server or $DISPLAY
      #   ERROR:aura/env.cc: The platform failed to initialize.  Exiting.
      #   <process did exit: exitCode=null, signal=SIGSEGV>
      # Playwright 把这一串收敛成 `electron.launch: Process failed to launch!`，
      # 看上去像产物坏了，实际只是没有显示后端。Chromium 的 headless 覆盖不到这里。
      #
      # 用常驻 Xvfb + 写 $GITHUB_ENV，而不是把 `xvfb-run` 套在 nx 命令外面：
      # nx 会派生多层子进程（run-commands → playwright → electron），DISPLAY 靠环境继承传下去
      # 比 wrapper 稳；而且写进 $GITHUB_ENV 后，后续步骤（重跑、trace 复现）也都有显示可用。
      # 无条件跑：headless Chromium 在 Xvfb 下行为不变，代价只有几百毫秒。
      - name: Start Xvfb (Electron 需要真实 X server)
        if: steps.check-e2e.outputs.need_e2e == 'true'
        run: |
          set -e
          command -v Xvfb >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }
          nohup Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # 用 socket 文件判就绪，不用 xdpyinfo —— x11-utils 不保证装了，多一个依赖就多一个失败点。
          for i in {1..30}; do
            if [ -S /tmp/.X11-unix/X99 ]; then
              echo "✅ Xvfb ready on :99"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Xvfb 未能在 30s 内就绪"
          cat /tmp/xvfb.log || true
          exit 1

      - name: Start Supabase for remote E2E
        if: steps.check-e2e.outputs.need_remote == 'true'
        working-directory: docker
        run: |
          set -e
          docker compose -f docker-compose.ci.yml pull
          docker compose -f docker-compose.ci.yml up -d
          timeout 60 bash -c 'until docker exec supabase-db pg_isready -U postgres -q; do sleep 1; done'
          docker exec -i supabase-db psql -U postgres -d postgres < sql/01-rxdb-system-tables.sql
          docker exec -i supabase-db psql -U postgres -d postgres < sql/02-rxdb-sync-functions.sql
          docker exec -i supabase-db psql -U postgres -d postgres < sql/03-business-tables.sql
          docker exec -i supabase-db psql -U postgres -d postgres < sql/04-rxdb-utils-functions.sql
          for i in {1..60}; do
            if curl -sf -H "apikey: $VITE_SUPABASE_KEY" http://localhost:54331/rest/v1/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.ci.yml ps
          exit 1

      # 刻意不加 --nxBail：各 e2e 项目互相独立，一次跑完能同时看到全部结果，
      # 而不是第一个挂了后面的根本没跑，下一轮又换一个挂。
      - name: Run E2E
        if: steps.check-e2e.outputs.need_e2e == 'true'
        env:
          NX_TUI: false
        run: |
          set -e
          [ "${{ inputs.run_mode }}" = "affected" ] && CMD="affected" || CMD="run-many"
          echo "🚀 Running: nx $CMD -t e2e e2e-remote"
          pnpm exec nx $CMD -t e2e e2e-remote --exclude=website,benchmarks --output-style=stream

          # 确保所有后台进程（webServer / vite preview）被清理
          jobs -p | xargs -r kill 2>/dev/null || true

      # 失败复盘用。`trace: 'on-first-retry'` 在四个 config 里都开着，
      # 重试产生的 trace.zip 就落在 test-output/playwright/output/ 下：
      #   pnpm exec playwright show-trace <zip>
      # 第三条 path 是为了兜住 dev-rxdb-react-e2e —— 它覆写了 reporter，
      # html 报告落在 playwright-report/ 而不是 preset 的 test-output/playwright/report/。
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() && steps.check-e2e.outputs.need_e2e == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            apps/*-e2e/test-output/playwright/report/**
            apps/*-e2e/test-output/playwright/output/**
            apps/*-e2e/playwright-report/**
          retention-days: 7
          if-no-files-found: ignore

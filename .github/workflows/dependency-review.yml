name: Dependency review

# PR 里新增/升级依赖时，比对 base 与 head 的依赖图，命中已知漏洞就拦下来。
#
# 它补的是一个真实缺口：`pnpm audit` 从来没进过 CI，Dependabot 的安全更新只在
# 漏洞**已经**合进 main 之后才开 PR。这条流水线是唯一一个在「引入的那一刻」
# 就说话的地方 —— 拦在合并前的成本，比合进去之后再回滚低一个数量级。
#
# 只在 pull_request 上跑：push 到 main 时依赖图没有可比的 base，跑了也没结论。

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          # high 起拦。moderate 在一个有 3000+ 传递依赖的 workspace 里几乎天天有，
          # 全拦会让这道门禁在两周内被当成噪音关掉 —— 那才是最坏结果。
          # moderate 及以下仍会出现在下面的 PR 摘要里，只是不阻塞。
          fail-on-severity: high

          # 例外：GHSA-mp2f-45pm-3cg9（decompress@4.2.1，critical，解压路径穿越）
          #
          # 开这个口子不是因为它不严重，而是因为它**没有依赖侧的修法**：
          #   - decompress 最高版本就是 4.2.1，上游已无人维护，补丁不会再有；
          #   - 维护分支 @xhmikosr/decompress 从 v5 起是 ESM-only，而引入它的
          #     download@7.1.0 是 CJS `require('decompress')`，alias 过去直接炸；
          #   - download@8.0.0（latest）依然写着 `decompress: ^4.2.1`，升上游无用。
          #
          # 引入链，全程 dev-only：
          #   apps/dev-rxdb-miniprogram（devDependency）
          #     └─ @tarojs/cli@4.2.1（已是 latest）
          #        └─ download-git-repo@3.0.2 → download@7.1.0 → decompress@4.2.1
          #
          # 唯一加载点是 @tarojs/cli 的 dist/create/fetchTemplate.js，即 `taro new`
          # 拉脚手架模板时解压 tarball。CI 不跑 `taro new`，`taro build` 不经过这条路，
          # 它也不进任何 publish 产物 —— 触发前提是开发者本地手动解一个不可信的模板包。
          #
          # 复查条件（满足任一就删掉这条例外重跑）：
          #   - @tarojs/cli 换掉 download-git-repo；
          #   - decompress 出现 4.2.1 以上的修复版本。

          # 例外：GHSA-8jmw-wjr8-2x66 / CVE-2022-25900（git-clone@0.1.0，high，命令注入）
          #
          # 同一条链上的第二个洞，同样没有依赖侧的修法，而且比上一条更彻底 ——
          # 上游直接把它判成了 won't fix：
          #   - 通告的 vulnerable range 是 `<= 0.2.0`，first_patched_version 为 null，
          #     等于「所有已发布版本」（npm 上只有 0.0.1 ~ 0.2.0，最后一次发布停在
          #     2021-09），override 到任何版本都不改变结论；
          #   - 通告里挂着的那个「修复」提交 fd33045，实际只往 README 加了一段
          #     「args 只接受可信输入」的警告，一行代码都没动，也从未发版。
          #
          # 而这条链上真实可达面为零：注入点是 `opts.args` / `opts.git` —— 它们被原样
          # 拼进 `git` 的参数表；repo 参数本身在 0.1.0 和 0.2.0 里都已经有 `--` 隔断，
          # 通告 PoC 里的 `--upload-pack=` 走不通。而调用方 download-git-repo@3.0.2
          # 只传 `{ checkout, shallow }`，两个注入项一个都没传 —— 装进来的 0.1.0 甚至
          # 还没有 `args` 这个选项（它是 0.2.0 才加的）。
          #
          # 引入链与上一条完全相同，全程 dev-only，加载点也还是 `taro new`：
          #   apps/dev-rxdb-miniprogram（devDependency）
          #     └─ @tarojs/cli@4.2.1 → download-git-repo@3.0.2 → git-clone@0.1.0
          #
          # 复查条件：@tarojs/cli 换掉 download-git-repo —— 届时这两条例外一起删。
          # 例外：GHSA-pfq8-rq6v-vf5m / CVE-2022-37620（html-minifier@4.0.0，high，ReDoS）
          #
          # 第三个洞，同样没有依赖侧的修法：
          #   - 通告的 vulnerable range 是 `<= 4.0.0`，first_patched_version 为 null，
          #     而 4.0.0 就是 npm 上的 latest —— 发布于 2019-04，此后再没出过新版，
          #     override 到任何版本都不改变结论；
          #   - 唯一还在维护的替代品 html-minifier-terser 不是 drop-in：它从 v6 起
          #     `minify()` 返回 Promise，而下面那个调用点是同步赋值 —— alias 过去
          #     会把 `[object Promise]` 原样写进模板产物，是比这个漏洞更确定的故障。
          #
          # 引入链，全程 dev-only：
          #   apps/dev-rxdb-miniprogram（devDependency）
          #     └─ @tarojs/vite-runner@4.2.1（已是 latest；4.2.2-beta 仍写着 ^4.0.0）
          #        └─ html-minifier@4.0.0
          #
          # 可达面同样为零：唯一加载点是 dist/mini/emit.js 的 generateTemplateFile()，
          # 整段被 `taroConfig.minifyXML?.collapseWhitespace` 门住，而本仓库 config/ 下
          # 从没打开过 minifyXML，那行 `require('html-minifier')` 不会执行。即便打开，
          # 喂进去的也是本仓库自己的模板产物 —— 编译期的可信输入，不存在攻击者可控的 HTML。
          #
          # 复查条件（满足任一就删掉这条例外重跑）：
          #   - @tarojs/vite-runner 换成 html-minifier-terser；
          #   - html-minifier 出现 4.0.0 以上的修复版本。
          allow-ghsas: GHSA-mp2f-45pm-3cg9, GHSA-8jmw-wjr8-2x66, GHSA-pfq8-rq6v-vf5m

          # 不开 comment-summary-in-pr：它要 `pull-requests: write`，而这条流水线
          # 其余部分一点写权限都不需要。为一条评论把整个 job 提权不划算 ——
          # 何况 fork 来的 PR 拿到的 GITHUB_TOKEN 本来就是只读的，评论也发不出去。
          # 完整报表始终写进 job summary（core.summary.write() 是无条件调用的），
          # 从那条红色的 check 点进去就能看到。

          # 不开 license 检查。这个仓库的依赖里有一批 BSD/ISC/Python-2.0 之类的
          # 变体写法，allow/deny 名单没人维护的话只会持续误报。
          # 真要管许可证，应该单独做一次全量盘点，而不是在这里顺手加一行。

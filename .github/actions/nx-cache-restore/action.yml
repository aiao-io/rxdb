name: Restore Nx cache
description: 只读恢复 Nx 本地任务缓存。

# 用 cache/restore 而不是 cache：只有 build job 回写（同 key 多写只有第一个生效，
# 其余会打 warning）。这里只读。
#
# restore-keys 的回退是关键：本 run 的 key 通常还没落盘（并行 job 抢跑），
# 于是回退到上一轮 run 的缓存 —— CI 因此不再是纯冷跑。
# Nx 的 hash 机制保证陈旧缓存只会 miss，不会用错产物。
#
# 只碰 .nx/cache，不碰 .nx/workspace-data（project graph 缓存，跨 job 复用有陈旧风险）。

runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v5
      with:
        path: .nx/cache
        key: nx-cache-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          nx-cache-${{ runner.os }}-

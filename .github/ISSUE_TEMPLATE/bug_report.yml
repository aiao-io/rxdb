name: '🐛 Bug report'
description: 'Report a reproducible defect so we can investigate it'
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Reproduction steps and environment details help us investigate quickly.
        Search [existing issues](https://github.com/aiao-io/rxdb/issues) before submitting to avoid duplicates.

  - type: input
    id: package
    attributes:
      label: Affected package
      description: 'For example, `@aiao/rxdb`, `@aiao/rxdb-adapter-pglite`, or `@aiao/rxdb-react`.'
      placeholder: '@aiao/rxdb'
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the current behavior and the behavior you expected.
      placeholder: Calling X throws Y, but the expected result is Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproduction code or set of steps. A StackBlitz or repository link is welcome.
      placeholder: |
        1. Define an entity ...
        2. Run a query ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include package versions, runtime, framework, and storage adapter.
      value: |
        - Aiao package version:
        - Framework (Angular/React/Vue and version):
        - Storage adapter (wa-sqlite / PGlite / Supabase / sqliteai):
        - Runtime (browser / Node / Electron / Tauri and version):
        - Node.js version:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Paste relevant console output or the stack trace.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I included reproduction steps or a minimal reproduction.
          required: true

name: '✨ Feature request'
description: 'Suggest a feature or improvement'
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the problem you want to solve as well as the behavior you have in mind.
        Search [existing issues](https://github.com/aiao-io/rxdb/issues) and the [roadmap](https://github.com/aiao-io/rxdb/blob/main/README.md) before submitting.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem do you encounter and in which context?
      placeholder: When I use ... I cannot ... because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What behavior or API would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Which other approaches did you consider and why did they not fit?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which layer does this request primarily affect?
      multiple: true
      options:
        - Core (rxdb)
        - Adapter (adapter-*)
        - Framework integration (angular / react / vue)
        - Plugin (plugin-*)
        - Developer tools (devtools)
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: symmetry
    attributes:
      label: Framework symmetry
      description: Framework features should provide equivalent Angular, React, and Vue APIs.
      options:
        - label: I understand that framework-related work should be symmetric across Angular, React, and Vue.
          required: true

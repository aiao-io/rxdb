name: ✨ 功能请求
description: 提出新功能或改进建议
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你要解决的问题，而不仅是你设想的方案 —— 这有助于我们评估更合适的实现。
        提交前请先搜索[已有 Issue](https://github.com/aiao-io/rxdb/issues) 与[路线图](https://github.com/aiao-io/rxdb/blob/main/README.md) 避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么痛点？
      placeholder: 当我在 ... 时，无法 ...，因为 ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望的行为或 API 大致是什么样？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些其他做法？为什么不采用？

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      description: 该功能主要影响哪一层？
      multiple: true
      options:
        - 核心 (rxdb)
        - 适配器 (adapter-*)
        - 框架集成 (angular / react / vue)
        - 插件 (plugin-*)
        - 开发者工具 (devtools)
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: symmetry
    attributes:
      label: 三框架对称性
      description: 本项目要求 Angular / React / Vue 同功能同 API。
      options:
        - label: 我理解框架相关功能需三端对称，单端缺失视为未完成

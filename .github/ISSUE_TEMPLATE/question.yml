name: '💬 Question'
description: 'Ask about usage, compatibility, or design'
title: '[Question]: '
labels: ['question', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Check the [documentation](https://rxdb.aiao.io/en/) and [existing issues](https://github.com/aiao-io/rxdb/issues) before submitting.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Describe your goal, current behavior, and expected behavior.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Environment and context
      description: Include the package, framework, adapter, runtime, and versions.
      value: |
        - Aiao package version:
        - Framework (Angular/React/Vue and version):
        - Storage adapter:
        - Runtime (browser / Node / Electron / Tauri):
        - Node.js / pnpm versions:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal example
      description: If applicable, provide runnable code, a repository, a StackBlitz link, or error logs.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I read the relevant documentation and searched existing issues.
          required: true

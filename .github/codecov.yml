codecov:
  max_report_age: off

# 全局忽略：测试相关文件不参与覆盖率统计（各包 vitest 配置之外的兜底守卫）
ignore:
  - '**/__tests__/**'
  - '**/*.spec.*'
  - '**/*.test.*'

coverage:
  precision: 2 # 覆盖率精度（小数点后位数）
  round: down # 向下取整
  range: 70..100 # 覆盖率颜色范围

  status:
    # 项目整体覆盖率
    project:
      default:
        target: 75% # 项目目标覆盖率
        threshold: 5% # 允许下降的阈值
        base: auto # 与哪个分支比较 (auto/parent/pr)
        if_ci_failed: error # CI 失败时的行为
        only_pulls: false # 也对非 PR 提交进行检查
        paths:
          - 'packages/**'

    # 补丁（新增代码）覆盖率
    patch:
      default:
        target: 80% # 新代码的目标覆盖率（要求更高）
        threshold: 50% # 允许下降的阈值
        base: auto
        if_ci_failed: error
        only_pulls: false
        # 与 project 同口径。上报的产物含 apps/ 与 modules/（演示应用与内部模块），
        # 不限定 paths 的话，改一个 demo 页面就会被要求 80% 补丁覆盖率。
        paths:
          - 'packages/**'

comment:
  layout: 'condensed_header, diff, flags, components'
  behavior: default # 评论行为：default, once, new, or off
  require_changes: false # 只有覆盖率变化时才评论
  require_base: false # 需要基础分支覆盖率数据
  require_head: true # 需要当前分支覆盖率数据
  require_bundle_changes: true # 只有 bundle 大小变化时才评论
  bundle_change_threshold: '1Kb' # bundle 变化阈值

# Bundle Analysis 配置
bundle_analysis:
  warning_threshold: '5%' # 超过 5% 的增长会显示警告
  status: 'informational' # 信息性状态（不会阻塞 PR）


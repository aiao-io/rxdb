# Netlify 部署配置
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
# 构建命令
command = "pnpm nx build website"
# 发布目录
publish = "website/build"
# Node.js 版本
NODE_VERSION = "26"

[build.environment]
# Netlify 安装依赖时默认 NODE_ENV=production，pnpm 10 按此硬编码跳过 devDependencies
# （无任何 CLI flag 可关闭），website 构建链上经根 devDependencies 进入依赖图的
# @angular-devkit/architect、clsx 等会缺失。显式声明开发环境，让安装与 GitHub CI、
# 本机一致。构建阶段的生产语义由 website/scripts/build-website.mjs 强制
# （NODE_ENV=production 传给所有子进程），不受这里的 development 影响。
NODE_ENV = "development"
# 冻结锁文件安装：与 GitHub CI / 本地一致。
PNPM_FLAGS = "--frozen-lockfile"
# corepack 老版本缺少 2025 年后 npm registry 轮换的签名 key，验证 pnpm 10.1.0+
# 时抛 Cannot find matching keyid。关闭完整性 key 校验绕开（HTTPS 下载仍由 TLS
# 保护，Netlify 论坛验证过的 workaround）。
COREPACK_INTEGRITY_KEYS = "0"
# 使用 HTTPS 协议克隆 Git 依赖
GIT_SSH_COMMAND = "true"
# 禁用 Nx Cloud（免费额度用完时构建会失败）
NX_NO_CLOUD = "true"

# 生产环境配置
[context.production]
command = "pnpm nx build website"

# 预览部署配置（PR/分支）
[context.deploy-preview]
command = "pnpm nx build website"

# 分支部署配置
[context.branch-deploy]
command = "pnpm nx build website"

# 重定向规则（如果 _redirects 文件不够用）
# SPA 路由回退已在 website/static/_redirects 中配置

# HTTP 头部配置
[[headers]]
for = "/demo/*"
[headers.values]
# 缓存策略 - demo 应用的静态资源
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/demo/*/index.html"
[headers.values]
# index.html 不缓存，确保用户总是获取最新版本
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/llms.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
# 选型索引承载发布指引，陈旧窗口收紧到 5 分钟；正缓存龄避免 max-age=0 时每次请求都回源（线上 smoke 实测 ~16 KB/s）
Cache-Control = "public, max-age=300"

[[headers]]
for = "/llms-full.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
# 8 MB 语料全文：正缓存龄让两层 CDN 命中，过期后走 304 条件校验；部署后陈旧窗口 ≤ 1 小时
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/*"
[headers.values]
# 安全头部
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
# WASM 支持
Cross-Origin-Embedder-Policy = "require-corp"
Cross-Origin-Opener-Policy = "same-origin"

# 插件配置
[[plugins]]
# 自动优化图片
package = "@netlify/plugin-sitemap"

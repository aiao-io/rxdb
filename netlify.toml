# Netlify 部署配置
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
# 构建命令
command = "pnpm nx build website"
# 发布目录
publish = "website/build"
# Node.js 版本
NODE_VERSION = "26"

[build.environment]
# 冻结锁文件安装：与 GitHub CI / 本地一致。此前 --no-frozen-lockfile 会让依赖图在
# Netlify 上自由漂移（nx@23.3.0 的 ngcli-adapter 因此解析不到 @angular-devkit/architect，
# Angular 演示构建直接崩），锁定后依赖图与锁文件提交物一致。
PNPM_FLAGS = "--frozen-lockfile"
# pnpm 在 NODE_ENV=production 时跳过 devDependencies，而 website 构建链上的
# @angular-devkit/architect 只经根 devDependencies（@angular/build / @angular/cli /
# angular-eslint）进入依赖图——这正是 Netlify 上该模块缺失的原因。显式声明开发环境，
# 让 Netlify 安装与 GitHub CI、本机完全一致。
NODE_ENV = "development"
# corepack 下载 pnpm 时禁止交互确认：构建机无 TTY，提示挂起会拖到依赖安装超时。
# 部署历史里 ~170s 的安装阶段失败与此吻合（跨分支间歇出现，registry 波动时必现）。
COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
# 使用 HTTPS 协议克隆 Git 依赖
GIT_SSH_COMMAND = "true"
# 禁用 Nx Cloud（免费额度用完时构建会失败）
NX_NO_CLOUD = "true"

# 生产环境配置
[context.production]
command = "pnpm nx build website"

# 预览部署配置（PR/分支）
[context.deploy-preview]
command = "pnpm nx build website"

# 分支部署配置
[context.branch-deploy]
command = "pnpm nx build website"

# 重定向规则（如果 _redirects 文件不够用）
# SPA 路由回退已在 website/static/_redirects 中配置

# HTTP 头部配置
[[headers]]
for = "/demo/*"
[headers.values]
# 缓存策略 - demo 应用的静态资源
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/demo/*/index.html"
[headers.values]
# index.html 不缓存，确保用户总是获取最新版本
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/llms.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
# 选型索引承载发布指引，陈旧窗口收紧到 5 分钟；正缓存龄避免 max-age=0 时每次请求都回源（线上 smoke 实测 ~16 KB/s）
Cache-Control = "public, max-age=300"

[[headers]]
for = "/llms-full.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
# 8 MB 语料全文：正缓存龄让两层 CDN 命中，过期后走 304 条件校验；部署后陈旧窗口 ≤ 1 小时
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/*"
[headers.values]
# 安全头部
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
# WASM 支持
Cross-Origin-Embedder-Policy = "require-corp"
Cross-Origin-Opener-Policy = "same-origin"

# 插件配置
[[plugins]]
# 自动优化图片
package = "@netlify/plugin-sitemap"
